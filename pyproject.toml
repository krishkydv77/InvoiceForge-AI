[project]
name = "invoce"
version = "1.0.0"
description = "AI-powered invoice extraction, validation, masking and PDF generation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "google-genai",
    "jinja2",
    "openpyxl",
    "pdf2image",
    "pdfplumber",
    "pillow",
    "pymysql",
    "pytesseract",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
    "weasyprint",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
